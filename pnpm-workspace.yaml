overrides:
  esbuild: '>=0.25.0'
  postcss: '>=8.5.10'
  sharp: '^0.35.3'
  brace-expansion@1: '^1.1.17'
  brace-expansion@5: '^5.0.8'
  nanoid: '>=3.3.17'
  dompurify: '>=3.4.13'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - '@vercel/speed-insights'
  - esbuild
  - sharp
  - unrs-resolver

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@vercel/speed-insights': true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@sentry/browser-utils@10.70.0'
  - '@sentry/browser@10.70.0'
  - '@sentry/core@10.70.0'
  - '@sentry/feedback@10.70.0'
  - '@sentry/nextjs@10.70.0'
  - '@sentry/node-core@10.70.0'
  - '@sentry/node@10.70.0'
  - '@sentry/opentelemetry@10.70.0'
  - '@sentry/react@10.70.0'
  - '@sentry/replay-canvas@10.70.0'
  - '@sentry/replay@10.70.0'
  - '@sentry/server-utils@10.70.0'
  - '@sentry/vercel-edge@10.70.0'
